<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akash | LanguaCall 3D Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* 1. LanguaCall Neon Lighting */
        .title {
            color: #00f2fe;
            font-size: 3em;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6), 0 0 40px rgba(0, 242, 254, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
            100% { text-shadow: 0 0 40px rgba(0, 242, 254, 1), 0 0 60px #00f2fe; }
        }

        .showcase-container {
            position: relative;
            width: 90%;
            max-width: 700px; /* Adjusts image size */
            cursor: pointer;
            transition: transform 0.5s ease;
        }
        .showcase-container:hover {
            transform: scale(1.02);
        }
        .main-img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0, 242, 254, 0.2);
        }

        /* 2. Translation Sentences Orbiting Effect */
        .orbit-container {
            position: absolute;
            top: 25%;
            left: 10%;
            width: 80%;
            height: 150px;
            pointer-events: none;
            display: none; /* Hidden until you click */
        }
        .translation-text {
            position: absolute;
            background: rgba(5, 5, 5, 0.85);
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1em;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            animation: orbitAnim 5s ease-in-out infinite;
            white-space: nowrap;
        }
        
        /* Path for the text to move around the toys */
        @keyframes orbitAnim {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            25% { transform: translate(150px, -40px) scale(1.1); opacity: 0.9; }
            50% { transform: translate(300px, 0) scale(1); opacity: 1; }
            75% { transform: translate(150px, 50px) scale(0.9); opacity: 0.9; }
            100% { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        /* 3. Live Timer Effect */
        .live-timer {
            position: absolute;
            bottom: 47%; /* Aligns with the timer in your image */
            left: 45%;
            transform: translateX(-50%);
            font-size: 2.2em;
            font-weight: bold;
            color: #ffcc00; /* Yellow color like in the image */
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.9);
            font-family: monospace;
            pointer-events: none;
        }

        .instruction {
            margin-top: 30px;
            color: #888;
            font-size: 0.9em;
            letter-spacing: 2px;
            animation: fadeInOut 2s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="title">LANGUACALL</div>

    <div class="showcase-container" onclick="startEffects()">
        <!-- The exact image name you uploaded -->
        <img src="1000110016.png" alt="LanguaCall AI View" class="main-img">
        
        <!-- Live Timer Box -->
        <div id="liveTimer" class="live-timer">00:47</div>

        <!-- Orbiting Translation Box -->
        <div id="orbitBox" class="orbit-container">
            <div class="translation-text">வணக்கம்! ➔ Hello! How are you?</div>
        </div>
    </div>

    <div class="instruction">CLICK THE IMAGE TO ACTIVATE AI</div>

    <script>
        let timerRunning = false;
        let seconds = 47; // Starts at 47 seconds just like your image

        function startEffects() {
            // 1. Show the orbiting text
            document.getElementById('orbitBox').style.display = 'block';

            // 2. Start the timer running
            if (!timerRunning) {
                timerRunning = true;
                setInterval(() => {
                    seconds++;
                    let min = Math.floor(seconds / 60);
                    let sec = seconds % 60;
                    
                    // Format to show 00:00 style
                    let displayMin = min < 10 ? "0" + min : min;
                    let displaySec = sec < 10 ? "0" + sec : sec;
                    
                    document.getElementById('liveTimer').innerText = displayMin + ":" + displaySec;
                }, 1000); // Updates every 1 second
            }
        }
    </script>
</body>
</html>
