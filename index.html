<!-- Add this Card inside your Featured Work section -->
<div class="card" onclick="openModal()">
    <h3>📱 LanguaCall AI Showcase</h3>
    <p>Real-time translation prototype with advanced AI agents and 3D visual flow.</p>
</div>

<!-- Modal Structure (Paste this before </body>) -->
<div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-content-wrapper">
        <div class="glow-effect">
            <img src="1000110016.png" class="interactive-img" id="mainImg">
            <!-- Translation Orbit stays in position -->
            <div class="text-orbit">வணக்கம்! ➔ Hello! How are you?</div>
        </div>
    </div>
</div>

<style>
/* 3D Interactive Effect */
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: #050505; }
.modal-content-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; }

.interactive-img { 
    width: 80%; max-width: 600px; 
    border-radius: 20px;
    /* Soft 3D float animation */
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0px) rotateX(0deg); }
    50% { transform: translateY(-20px) rotateX(2deg); }
}

/* Fixed Position Orbiting Text */
.text-orbit {
    position: absolute;
    top: 28%; /* Adjust to match the text position in image */
    left: 45%;
    background: rgba(0, 242, 254, 0.15);
    border: 1px solid #00f2fe;
    padding: 10px 20px;
    border-radius: 20px;
    color: #fff;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); box-shadow: 0 0 10px #00f2fe; }
    to { transform: scale(1.05); box-shadow: 0 0 25px #00f2fe; }
}

.close { color: #fff; position: fixed; top: 20px; right: 40px; font-size: 50px; cursor: pointer; }
</style>

<script>
function openModal() { document.getElementById('imageModal').style.display = 'block'; }
function closeModal() { document.getElementById('imageModal').style.display = 'none'; }
</script>
